syntax = "proto3";

package namespace.experimental.remote;

option go_package = "namespacelabs.dev/internal/public/gen/proto/namespace/experimental/remote";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ResultsService provides access to computed results of invocations.
//
// An invocation is defined by a set of typed inputs (e.g., a git repository
// at a specific commit). If a result for those inputs has already been
// computed, it can be fetched without re-executing the computation.
//
// ## Workflow
//
// 1. Call `FetchResult` with the input specification to check if a result exists.
// 2. If a result exists, iterate over the returned outputs.
// 3. Call `PrepareDownload` with each output_id to obtain a downloadable URL.
//
// ## Authentication
//
// Calls to the ResultsService require a *tenant token* passed as a Bearer
// token as part of each call.
service ResultsService {
    // Fetches the result for a given set of inputs, if one exists.
    //
    // Returns outputs which can be used with PrepareDownload to obtain
    // actual download URLs. Always returns a result_reference that can be
    // used to upload a new result for the same inputs.
    //
    // If the result does not exist, not_found is set to true.
    rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);

    // Prepares an output for download by generating an accessible URL.
    //
    // The returned URL is time-limited and should be used promptly.
    //
    // ### Errors
    // - If the output_id is invalid or expired, a `NotFound` status is returned.
    rpc PrepareDownload(PrepareDownloadRequest) returns (PrepareDownloadResponse);

    // Prepares to upload a new result.
    //
    // Returns upload URLs for each output file. After uploading all files,
    // call FinalizeUploadResult to commit the result.
    //
    // ### Errors
    // - If the result_reference is invalid, an `InvalidArgument` status is returned.
    rpc PrepareUploadResult(PrepareUploadResultRequest) returns (PrepareUploadResultResponse);

    // Finalizes a result upload after all output files have been uploaded.
    //
    // ### Errors
    // - If the finalize_token is invalid or expired, a `NotFound` status is returned.
    rpc FinalizeUploadResult(FinalizeUploadResultRequest) returns (FinalizeUploadResultResponse);

    // Returns a list of all results that match the specified filter.
    rpc ListResults(ListResultsRequest) returns (ListResultsResponse);

    // Expires a result, marking it for garbage collection.
    //
    // ### Errors
    // - If the result does not exist, a `NotFound` status is returned.
    rpc ExpireResult(ExpireResultRequest) returns (ExpireResultResponse);

    // Streams the command output logs for a result.
    //
    // Returns chunks of stdout/stderr as they were captured during command execution.
    //
    // ### Errors
    // - If the result does not exist, a `NotFound` status is returned.
    // - If the result has no command output, an empty stream is returned.
    rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);

    // Streams the entries of a snapshot.
    //
    // Returns one entry per file, directory, or symlink in the snapshot,
    // including file stats (mode, size, timestamps, etc.).
    //
    // ### Errors
    // - If the result does not exist, a `NotFound` status is returned.
    // - If the snapshot key is invalid, a `NotFound` status is returned.
    rpc StreamSnapshotEntries(StreamSnapshotEntriesRequest) returns (stream SnapshotEntry);
}

message StreamLogsRequest {
    // The unique identifier for the result whose logs to stream.
    string result_id = 1;
}

message LogChunk {
    // The content of this chunk.
    bytes content = 1;

    // The stream this chunk belongs to.
    LogStream stream = 2;
}

enum LogStream {
    LOG_STREAM_UNSPECIFIED = 0;
    LOG_STREAM_STDOUT = 1;
    LOG_STREAM_STDERR = 2;
}

message FetchResultRequest {
    // The set of inputs that define the computation.
    // All inputs must be fully described.
    // Either inputs or result_id must be provided, but not both.
    repeated Input inputs = 1;

    // Alternatively, fetch a result by its unique identifier.
    // If set, inputs must be empty.
    string result_id = 2;

    // If true, the response will include the original inputs that produced the result.
    // Only applicable when fetching by result_id.
    bool include_inputs = 3;
}

message FetchResultResponse {
    // True if no result exists for the given inputs.
    bool not_found = 1;

    // An opaque reference that can be used with PrepareUploadResult
    // to upload a new result for the same inputs. Always set.
    bytes result_reference = 2;

    // The unique identifier for this result. Only set if not_found is false.
    string result_id = 3;

    // The inputs that produced this result. Only set if not_found is false.
    repeated Input inputs = 4;

    // When this result was computed. Only set if not_found is false.
    google.protobuf.Timestamp computed_at = 5;

    // When this result expires and may be garbage collected. Only set if not_found is false.
    google.protobuf.Timestamp expires_at = 6;

    // The command output, if captured. Only set if not_found is false.
    CommandOutput command_output = 7;

    // Snapshots, if any. Only set if not_found is false.
    repeated Snapshot snapshots = 9;

    // Annotations about the command execution. Only set if not_found is false.
    CommandAnnotations annotations = 10;

    // Where this result was created. Only set if not_found is false.
    Origin origin = 11;
}

// Command output metadata for download.
message CommandOutput {
    // An opaque identifier used to retrieve the actual content.
    // Pass this to PrepareDownload to get a downloadable URL.
    string output_id = 1;

    // The size of the output stream in bytes.
    int64 size = 2;
}

// Input represents a typed input to a computation.
// Exactly one of the input type fields must be set.
//
// Either a Canonical or CommandInvocation input must be present when computing
// a result; they are mutually exclusive. When a Canonical input is set, only
// a single GitRepository or ContainerImage input may be defined.
message Input {
    // A unique key identifying this input within the computation.
    string key = 1;

    // A git repository at a specific revision.
    GitRepository git_repository = 2;

    // A container image reference.
    ContainerImage container_image = 3;

    // A reference to content by its digest.
    ContentReference content_reference = 4;

    // A command invocation.
    CommandInvocation command_invocation = 5;

    // A canonical identifier for the computation.
    Canonical canonical = 6;

    // A reference to a snapshot from a previous result.
    SnapshotInput snapshot_input = 7;
}

// A git repository at a specific revision.
message GitRepository {
    // The repository URL (e.g., "https://github.com/owner/repo").
    string url = 1;

    // The commit digest, prefixed by the algorithm.
    // E.g., "sha1:a3f5b7c9d1e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0".
    string digest = 2;
}

// A container image reference.
message ContainerImage {
    // The image repository (e.g., "docker.io/library/alpine").
    string repository = 1;

    // The image digest, prefixed by the algorithm.
    // E.g., "sha256:a3f5b7c9d1e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2".
    string digest = 2;
}

// A reference to content by its digest.
message ContentReference {
    // The path identifying this content.
    string path = 1;

    // The content type (e.g., "application/json").
    string content_type = 2;

    // The content digest, prefixed by the algorithm.
    // E.g., "sha256:a3f5b7c9d1e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2".
    string content_digest = 3;
}

// A command invocation with its arguments and environment.
message CommandInvocation {
    // The command to execute.
    string command = 1;

    // The arguments to pass to the command.
    repeated StringOrDigest args = 2;

    // Environment variables set for the command.
    repeated EnvVar env = 3;

    // The platform on which the command runs (e.g., "linux/amd64", "darwin/arm64").
    string platform = 4;

    // An ordered list of inputs and their mount points.
    // Describes where each input was made available to the command.
    // For example, in a container invocation (run-docker), the container image
    // is mounted at "/", while a git repository might be mounted at "/workspace".
    repeated CommandMount mounts = 5;
}

// Describes where an input was mounted for a command invocation.
message CommandMount {
    // The mount point where this input was available to the command.
    // E.g., "/" for a container image, "/workspace" for a git repository.
    string mount_point = 1;

    // The key of the input (references Input.key in the same computation).
    string input_key = 2;
}

// A canonical identifier for a computation.
// When used, only a single GitRepository or ContainerImage input is allowed alongside it.
// Mutually exclusive with CommandInvocation inputs.
message Canonical {
    // A free-form string identifying the version of the computation.
    string version = 1;
}

// A reference to a snapshot from a previous result.
message SnapshotInput {
    // The result ID containing the snapshot.
    string result_id = 1;

    // The snapshot key within the result. Optional if the result has only one snapshot.
    string snapshot_key = 2;
}

// A string value that can be either an explicit value or a digest of a value.
// Use digest for secret values that should not be stored in plain text.
message StringOrDigest {
    // The explicit string value.
    string inline = 1;

    // The digest of the value, prefixed by the algorithm.
    // E.g., "sha256:a3f5b7c9d1e2...". Use this for secret values.
    string digest = 2;
}

// An environment variable with a key and a value or digest.
message EnvVar {
    // The environment variable name.
    string key = 1;

    // The value of the environment variable.
    StringOrDigest value = 2;
}

// A cryptographic digest of content.
message Digest {
    // The hash algorithm used (e.g., "blake3", "sha256").
    string algorithm = 1;

    // The hex-encoded hash value.
    string value = 2;
}

// Package kind used for snapshots.
enum PackageKind {
    PACKAGE_KIND_UNSPECIFIED     = 0;
    PACKAGE_KIND_ZIP_ZSTD        = 1;  // ZIP archive with Zstandard compression
    PACKAGE_KIND_ZIP_UNCOMPRESSED = 2;  // ZIP archive with no compression
}

message PrepareDownloadRequest {
    // The opaque output_id obtained from Output.
    string output_id = 1;
}

message PrepareDownloadResponse {
    // A URL that can be used to download the content.
    // The URL is time-limited (typically valid for 30 minutes).
    RemoteURL remote_url = 1;

    // Reserved for future use: a local file path.
    LocalFile local_file = 2;
}

// A URL-based download location.
message RemoteURL {
    // The signed URL for downloading.
    string url = 1;

    // When this URL expires.
    google.protobuf.Timestamp expires_at = 2;
}

// A local file location (for future use with local caching).
message LocalFile {
    // The local file path.
    string path = 1;
}

message PrepareUploadResultRequest {
    // The opaque reference obtained from FetchResultResponse.
    bytes result_reference = 1;

    // Optional command output to upload (combined stdout/stderr stream).
    CommandOutputToUpload command_output = 3;

    // Optional snapshots to upload.
    repeated SnapshotToUpload snapshots = 5;

    // Optional annotations about the command execution.
    // These do not contribute to the input digest and are stored for informational purposes only.
    CommandAnnotations annotations = 6;
}

// Annotations about a command execution that do not affect the result identity.
// These are stored for informational purposes only and do not contribute to the input digest.
message CommandAnnotations {
    // The wall-clock duration of the command execution.
    google.protobuf.Duration command_duration = 1;
}

// Information about where a result was created.
message Origin {
    // The instance ID of the ephemeral machine that produced the result.
    string instance_id = 1;
}

// Describes a snapshot to be uploaded.
message SnapshotToUpload {
    // A unique key identifying this snapshot within the result.
    // Required when multiple snapshots exist, optional for a single snapshot.
    string key = 1;

    // The base contents package to upload.
    BaseContentsToUpload base_contents = 2;

    // Large files to upload. These are applied on top of base contents.
    repeated LargeFileToUpload large_files = 3;

    // A packed snapshot to upload. Mutually exclusive with base_contents/large_files.
    PackedSnapshotToUpload packed = 4;
}

// Base contents of a snapshot to be uploaded.
message BaseContentsToUpload {
    // The package kind used for the base contents.
    PackageKind kind = 1;

    // The size of the package in bytes.
    int64 size = 2;

    // Optional content digest. If provided and content with this digest
    // already exists, no upload is required.
    Digest digest = 3;
}

// A large file within a snapshot to be uploaded.
message LargeFileToUpload {
    // The file path relative to the snapshot root.
    string path = 1;

    // The size of the file in bytes.
    int64 size = 2;

    // The file mode (permissions) as a POSIX mode_t.
    uint32 mode = 3;

    // The status change time of the file (ctime).
    google.protobuf.Timestamp ctime = 4;

    // Optional content digest. If provided and content with this digest
    // already exists, no upload is required.
    Digest digest = 5;

    // The modification time of the file (mtime).
    google.protobuf.Timestamp mtime = 6;
}

// Describes a packed snapshot to be uploaded.
message PackedSnapshotToUpload {
    // Total size of the packed snapshot in bytes.
    int64 total_size = 1;

    // Digest of the complete packed snapshot.
    Digest digest = 2;
}

// Describes a command's output stream to be uploaded.
// The stream contains interleaved stdout and stderr chunks in a reproducible format.
message CommandOutputToUpload {
    // The size of the output stream in bytes.
    int64 size = 1;
}

// Metadata appended to the end of a command output stream.
// The stream format is:
//   [interleaved chunk data][8-byte separator][CommandOutputMetadata proto][4-byte proto size (big-endian)]
// The separator is: 0x00 0xFF 0x00 0xFF 0x00 0xFF 0x00 0xFF
message CommandOutputMetadata {
    // The size of each chunk in bytes, in order.
    repeated int64 chunk_sizes = 1;

    // Bitmask indicating which chunks are stderr (1) vs stdout (0).
    // Bit N corresponds to chunk N. Multiple bytes for >8 chunks.
    bytes stderr_mask = 2;
}

message PrepareUploadResultResponse {
    // An opaque token containing all state needed to finalize the upload.
    // Pass this to FinalizeUploadResult after uploading all files.
    bytes finalize_token = 1;

    // Upload target for the command output, if requested.
    CommandOutputUpload command_output = 3;

    // Upload targets for each snapshot, in the same order as the request.
    repeated SnapshotUpload snapshots = 5;
}

// Upload information for command output.
message CommandOutputUpload {
    // The signed URL to upload the command output to.
    string upload_url = 1;

    // When this upload URL expires.
    google.protobuf.Timestamp expires_at = 2;
}

// Upload information for a snapshot.
message SnapshotUpload {
    // The key identifying this snapshot (matches SnapshotToUpload.key).
    string key = 1;

    // Upload target for the base contents package.
    BaseContentsUpload base_contents = 2;

    // Upload targets for each large file, in the same order as the request.
    repeated LargeFileUpload large_files = 3;

    // Upload target for a packed snapshot. Set when the snapshot is packed.
    PackedSnapshotUpload packed = 5;
}

// Upload information for base contents of a snapshot.
message BaseContentsUpload {
    // The signed URL to upload the base contents package to.
    // Not set if the content already exists (check uploaded_at instead).
    string upload_url = 1;

    // When this upload URL expires.
    // Only set if upload_url is set.
    google.protobuf.Timestamp expires_at = 2;

    // When the content was previously uploaded.
    // Set instead of upload_url if content with the provided digest already exists.
    google.protobuf.Timestamp uploaded_at = 3;
}

// Upload information for a large file within a snapshot.
message LargeFileUpload {
    // The file path relative to the snapshot root.
    string path = 1;

    // The signed URL to upload the file content to.
    // Not set if the content already exists (check uploaded_at instead).
    string upload_url = 2;

    // When this upload URL expires.
    // Only set if upload_url is set.
    google.protobuf.Timestamp expires_at = 3;

    // When the content was previously uploaded.
    // Set instead of upload_url if content with the provided digest already exists.
    google.protobuf.Timestamp uploaded_at = 4;
}

// Upload target for a range within a packed snapshot object.
message PackedSnapshotUploadSlot {
    // Byte offset within the packed snapshot object.
    int64 offset = 1;

    // Number of bytes to upload for this slot.
    int64 length = 2;

    // The signed URL to upload this slot's content to.
    string upload_url = 3;
}

// Upload information for a packed snapshot.
message PackedSnapshotUpload {
    // Upload slots assigned by the server.
    // Each slot describes the byte range to upload and the signed URL to use.
    repeated PackedSnapshotUploadSlot slots = 1;

    // When these upload URLs expire.
    // Only set if slots is non-empty.
    google.protobuf.Timestamp expires_at = 2;

    // When the packed snapshot was previously uploaded.
    // Set instead of slots if content with the provided digest already exists.
    google.protobuf.Timestamp uploaded_at = 3;
}

message FinalizeUploadResultRequest {
    // The opaque token from PrepareUploadResultResponse containing all
    // state needed to finalize the upload.
    bytes finalize_token = 1;
}

message FinalizeUploadResultResponse {
    // The unique identifier for the newly created result.
    string result_id = 1;
}

message ListResultsRequest {
    // If a previous response returned a `pagination_cursor`, it can be
    // specified to continue reading results with the same arguments as the
    // original call.
    bytes pagination_cursor = 1;

    // The maximum number of entries to return as part of this ListResults
    // request. A maximum number of entries may also be specified when
    // `pagination_cursor` is set.
    //
    // We won't return more than `max_entries`, but may return fewer.
    int64 max_entries = 2;

    // Don't return results that were computed before the specified timestamp
    // (in UTC).
    google.protobuf.Timestamp not_older_than = 3;
}

message ListResultsResponse {
    // The list of results that match the filter.
    repeated ResultMetadata results = 1;

    // If set, there are additional results. Pass the same cursor to a
    // subsequent ListResults call to continue fetching results.
    bytes pagination_cursor = 2;
}

// Metadata about a computed result.
message ResultMetadata {
    // The unique identifier for this result.
    string result_id = 1;

    // The inputs that produced this result.
    repeated Input inputs = 2;

    // When this result was computed.
    google.protobuf.Timestamp computed_at = 4;

    // When this result expires and may be garbage collected.
    google.protobuf.Timestamp expires_at = 5;

    // The command output, if captured.
    CommandOutput command_output = 6;

    // Snapshots, if any.
    repeated Snapshot snapshots = 8;

    // Where this result was created, if known.
    Origin origin = 9;
}

// A snapshot represents a complete filesystem state composed of base contents
// and large files applied on top. Snapshots have a well-defined ID based on
// their contents.
message Snapshot {
    // A unique key identifying this snapshot within the result.
    // Required when multiple snapshots exist, optional for a single snapshot.
    string key = 1;

    // The content-derived digest of this snapshot.
    // Computed as: hash(base_contents.digest, [large_file.digest, ...])
    // where large files are sorted lexically by path.
    Digest digest = 2;

    // The base contents package. The base_dir is always "/" (root of snapshot).
    // Large files appear as empty files in the base contents.
    BaseContents base_contents = 3;

    // Large files that are applied on top of the base contents.
    // These replace the empty placeholder files in the base contents.
    repeated LargeFile large_files = 4;

    // A packed snapshot stored as a single packed object.
    // Mutually exclusive with base_contents/large_files.
    PackedSnapshot packed = 5;
}

// Base contents of a snapshot, always rooted at "/".
message BaseContents {
    // The package kind used for the base contents.
    PackageKind kind = 1;

    // An opaque identifier used to retrieve the actual content.
    // Pass this to PrepareDownload to get a downloadable URL.
    string output_id = 2;

    // The size of the package in bytes.
    int64 size = 3;

    // The content digest of the base contents package.
    Digest digest = 4;
}

// A large file within a snapshot. Large files cannot be directories or symlinks;
// those are always represented in the base contents.
message LargeFile {
    // The file path relative to the snapshot root.
    string path = 1;

    // An opaque identifier used to retrieve the actual content.
    // Pass this to PrepareDownload to get a downloadable URL.
    string output_id = 2;

    // The size of the file in bytes.
    int64 size = 3;

    // The file mode (permissions) as a POSIX mode_t.
    uint32 mode = 4;

    // The status change time of the file (ctime).
    google.protobuf.Timestamp ctime = 5;

    // The content digest of the file.
    Digest digest = 6;

    // The modification time of the file (mtime).
    google.protobuf.Timestamp mtime = 7;
}

// A packed snapshot stored as a single packed object.
message PackedSnapshot {
    // Total size of the packed snapshot in bytes.
    int64 total_size = 1;

    // Digest of the complete packed snapshot.
    Digest digest = 2;

    // Opaque identifier used to retrieve the packed snapshot as a single object.
    // Pass this to PrepareDownload to get a downloadable URL.
    string output_id = 3;
}

message ExpireResultRequest {
    // The unique identifier for the result to expire.
    string result_id = 1;
}

message ExpireResultResponse {
    // The updated expiration time (set to now or in the past).
    google.protobuf.Timestamp expires_at = 1;
}

message StreamSnapshotEntriesRequest {
    // The unique identifier for the result containing the snapshot.
    string result_id = 1;

    // The key identifying which snapshot to stream entries for.
    // If empty and there is exactly one snapshot, that snapshot is used.
    string snapshot_key = 2;
}

// A single entry in a snapshot (file, directory, or symlink).
message SnapshotEntry {
    // The path relative to the snapshot root.
    string path = 1;

    // The type of this entry.
    SnapshotEntryType type = 2;

    // The file mode (permissions) as a POSIX mode_t.
    uint32 mode = 3;

    // The size in bytes. Only set for regular files.
    int64 size = 4;

    // The modification time of the entry.
    google.protobuf.Timestamp mtime = 5;

    // The status change time of the entry.
    google.protobuf.Timestamp ctime = 6;

    // The content digest. Only set for regular files.
    Digest digest = 7;

    // The symlink target. Only set for symlinks.
    string link_target = 8;
}

enum SnapshotEntryType {
    SNAPSHOT_ENTRY_TYPE_UNSPECIFIED = 0;
    SNAPSHOT_ENTRY_TYPE_FILE = 1;
    SNAPSHOT_ENTRY_TYPE_DIRECTORY = 2;
    SNAPSHOT_ENTRY_TYPE_SYMLINK = 3;
}
