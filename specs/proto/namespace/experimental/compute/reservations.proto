syntax = "proto3";

package namespace.experimental.compute;

import "google/protobuf/timestamp.proto";
import "proto/namespace/cloud/compute/v1beta/compute.proto";

// ReservationService provides an extension of ComputeService, trading
// latency for more persistent instance creation requests.
//
// The basic unit is a "reservation," the intent to create an instance
// by some deadline. In the case where instance creation may otherwise
// fail, for example because the caller has no available contracted
// capacity, the request // will be queued until it is possible to fulfill
// or until the reservation deadline elapses.
service ReservationService {
    // Create a reservation for an instance. The server will immediately
    // return a reservation ID and attempt to create the desired instance.
    // In the event that the instance cannot be created instantaneously, the
    // server will periodically retry until the provided reservation deadline.
    rpc ReserveInstance(ReserveInstanceRequest) returns (ReserveInstanceResponse);

    // Returns the metadata about a previously created reservation. Includes
    // the instance ID of the instance that fulfilled the reservation, if
    // such an instance exists.
    rpc DescribeReservation(DescribeReservationRequest) returns (DescribeReservationResponse);

    // Cancel a pending reservation. Has no effect if the reservation has expired;
    // throws an error if it has already been fulfilled (i.e. if it has a corresponding
    // running instance). Equivalent to UpdateReservationDeadline(now).
    rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);

    // Update the deadline of a reservation. Fails if the new deadline is in the past
    // or if the reservation has already been fulfilled. UpdateReservationDeadline(now)
    // is equivalent to CancelReservation.
    rpc UpdateReservationDeadline(UpdateReservationDeadlineRequest) returns (UpdateReservationDeadlineResponse);

    // List reservations that were active within a specified time range.
    rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
}

message ReserveInstanceRequest {
    // All parameters for the underlying instance to be created
    namespace.cloud.compute.v1beta.CreateInstanceRequest create_instance_req  = 1;

    // Deadline by which the instance should be created. If the reservation has
    // not been fulfilled by this time, the server will no longer attempt to
    // create the instance.
    google.protobuf.Timestamp                            reservation_deadline = 2;

    // Priority amongst all reservations. Higher value = higher priority.
    // Negative values are allowed.
    int64                                                priority             = 3;
}

message ReserveInstanceResponse {
    string 		reservation_id = 1;
    ReservationMetadata metadata = 2;

    message ReservationMetadata {
        // The time at which the reservation was initially requested
        google.protobuf.Timestamp reservation_time     = 1;

        google.protobuf.Timestamp reservation_deadline = 2;
    }
}

message DescribeReservationRequest {
    string reservation_id = 1;
}

message DescribeReservationResponse {
    string reservation_id = 1;

    reserved 2;
    ReserveInstanceResponse.ReservationMetadata reservation_metadata = 3;

    // If the reservation has been fulfilled, the corresponding instance ID
    // and the time at which the fulfillment occurred
    string instance_id = 4;
    google.protobuf.Timestamp fulfillment_time = 5;

    CreationAttempt last_attempt = 6;
    ReservationStatus status = 7;

    int64 priority = 8;
}

message CreationAttempt {
    google.protobuf.Timestamp timestamp = 1;

    // Instance that was started on this attempt.
    // If creating an instance failed, error will be set instead.
    string instance_id = 2;

    // Set if creating an instance failed on this attempt.
    string error = 3;
}

enum ReservationStatus {
    UNKNOWN = 0;
    // Reservation is in progress, no instance has been assigned yet.
    PENDING = 1;
    // An instance was assigned to the reservation.
    FULFILLED = 2;
    // The reservation deadline is in the past and no instance was assigned.
    EXPIRED = 3;
}

message CancelReservationRequest {
    string reservation_id = 1;
}

message CancelReservationResponse {
    google.protobuf.Timestamp reservation_deadline = 1;
}

message UpdateReservationDeadlineRequest {
    string reservation_id = 1;
    google.protobuf.Timestamp reservation_deadline = 2;
}

message UpdateReservationDeadlineResponse {
    google.protobuf.Timestamp reservation_deadline = 1;
}

message ListReservationsRequest {
    // When filtering for a time range, we return all reservations which were/are
    // active at any point in that time range, meaning at least one of (creation_time,
    // reservation_end) is in the window [period_start, period_end] OR
    // creation_time < period_start < period_end < reservation_end.
    // We consider reservation_end to be the reservation_deadline for reservations
    // that have not been fulfilled, and fulfillment_time for those that have, so
    // a reservation with fulfillment_time < period_start <= reservation_deadline
    // will not be included in the response.
    google.protobuf.Timestamp period_start = 1; // default to epoch
    google.protobuf.Timestamp period_end = 2; // default to now

    // Maximum number of reservations to return. Capped at 50,000; default 100
    int64 max_entries = 3;

    // If true, no reservations that have been fulfilled (have an instance assigned)
    // will be returned
    bool exclude_fulfilled = 4;
}

message ListReservationsResponse {
    repeated DescribeReservationResponse reservations = 1;
}
