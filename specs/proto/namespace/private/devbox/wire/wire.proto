syntax = "proto3";

package namespace.private.devbox.wire.v1beta;

option go_package = "namespacelabs.dev/internal/public/gen/proto/namespace/private/devbox/wire";

import "google/protobuf/empty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
    rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc ResetForLease(ResetForLeaseRequest) returns (stream ResetForLeaseEvent);
    rpc WatchBoot(google.protobuf.Empty) returns (stream BootOpResult);

    rpc QueryState(QueryStateRequest) returns (QueryStateResponse);
    rpc StreamQueryState(stream QueryStateRequest) returns (stream QueryStateResponse);

    rpc Run(RunCommand) returns (stream RunOutputChunk);
    // RunExec starts a command on the devbox and streams its stdout/stderr until
    // the command exits. The command and its output are retained locally by the
    // agent just like StartExec commands.
    rpc RunExec(StartExecRequest) returns (stream ExecLogChunk);
    // StartExec starts a command on the devbox and returns immediately with an
    // exec id that can be used to stream the command's retained logs.
    rpc StartExec(StartExecRequest) returns (StartExecResponse);
    // StopExec requests termination of a command's process group. Success
    // acknowledges the request, not completion; observe ListLogs or StreamExecLogs
    // for the final result. Repeating a mode is a no-op; graceful can be escalated
    // to force. Completed executions are a no-op; unknown IDs return NotFound,
    // and boot actions return FailedPrecondition. Canceling this RPC does not
    // undo a stop that has already been accepted.
    // Control ends when the group leader exits, even if output is still draining.
    // Descendants that change process groups or outlive the leader are not managed.
    rpc StopExec(StopExecRequest) returns (google.protobuf.Empty);
    // ListLogs lists actions retained by the devbox agent, including startup
    // boot actions and exec actions.
    rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
    // ReadExecLogs streams stdout/stderr retained when the request begins, then
    // completes without waiting for the execution to finish. A successful end
    // of stream means that all output captured by the request was sent.
    rpc ReadExecLogs(ReadExecLogsRequest) returns (stream ExecLogChunk);
    // StreamExecLogs first replays retained stdout/stderr for an exec id, then
    // follows new output until that execution finishes.
    rpc StreamExecLogs(StreamExecLogsRequest) returns (stream ExecLogChunk);

    rpc CreateGitWorktree(CreateGitWorktreeRequest) returns (CreateGitWorktreeResponse);
    rpc ListGitWorktrees(ListGitWorktreesRequest) returns (ListGitWorktreesResponse);
    rpc RemoveGitWorktree(RemoveGitWorktreeRequest) returns (google.protobuf.Empty);

    rpc AddTerminalSession(AddTerminalSessionRequest) returns (TerminalSession);
    rpc CreateTerminalSession(CreateTerminalSessionRequest) returns (TerminalSession);
    rpc DeleteTerminalSession(DeleteTerminalSessionRequest) returns (google.protobuf.Empty);
    rpc ListTerminalSessions(google.protobuf.Empty) returns (ListTerminalSessionsResponse);

    rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
    rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
    rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
    rpc StartService(StartServiceRequest) returns (StartServiceResponse);
    rpc StopService(StopServiceRequest) returns (StopServiceResponse);
    rpc SignalService(SignalServiceRequest) returns (SignalServiceResponse);

    rpc CreatePort(CreatePortRequest) returns (CreatePortResponse);
    rpc DeletePort(DeletePortRequest) returns (DeletePortResponse);
    rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);

    rpc UpdateRuntimeConfiguration(AgentRuntimeConfiguration) returns (AgentRuntimeConfiguration);
}

message CreateTerminalSessionRequest {
    string name = 1;
    string command = 2;
}

message RunCommand {
    Cwd             cwd                    = 1;
    string          command                = 2;
    repeated string args                   = 3;
    repeated EnvVar additional_environment = 4;
    ValueOrSecret   stdin                  = 5;
    string          run_as                 = 6;
}

message StartExecRequest {
    // Command to start on the devbox.
    RunCommand command = 1;
}

message StartExecResponse {
    // Agent-local identifier for the started exec.
    string exec_id = 1;
}

message StopExecRequest {
    string exec_id = 1;
    // Required. If the command has not started yet, either mode prevents launch.
    Mode mode = 2;

    enum Mode {
        MODE_UNSPECIFIED = 0;
        // Send SIGTERM, allowing cleanup. No automatic escalation or deadline;
        // a command that ignores SIGTERM may continue until a forced stop.
        MODE_GRACEFUL = 1;
        // Send SIGKILL immediately, without allowing cleanup.
        MODE_FORCE = 2;
    }
}

message ListLogsRequest {}

message ListLogsResponse {
    // Retained actions, sorted by start time.
    repeated ExecLogAction actions = 1;
}

message ExecLogMetadata {
    // Actions retained by the agent for ListLogs.
    repeated ExecLogAction actions = 1;
}

message ExecLogAction {
    // Log id returned by StartExec or exposed by ServiceProcess.
    string id = 1;
    // Command that was executed.
    RunCommand command = 2;
    // Human-readable boot operation name for boot actions.
    string boot_name = 3;
    // Original boot operation for boot actions.
    AgentBoot.Op boot_op = 4;
    // Time when the action started.
    google.protobuf.Timestamp started_at = 5;
    // Time when the action completed. Unset while running.
    google.protobuf.Timestamp completed_at = 6;
    // Error text captured when the action failed.
    string error = 7;
    // Process exit code for executed actions. Zero means success or not applicable.
    int32 exit_code = 8;
    // Service that produced this log. Set only for services.
    string service_id = 9;
}

message ReadExecLogsRequest {
    // Exec id from StartExec, ServiceProcess, or ListLogs.
    string exec_id = 1;
}

message StreamExecLogsRequest {
    // Exec id from StartExec, ServiceProcess, or ListLogs.
    string exec_id = 1;
}

message ExecLogChunk {
    // Exec id this chunk belongs to.
    string exec_id = 1;
    // Bytes written to stdout by the exec.
    bytes stdout = 2;
    // Bytes written to stderr by the exec.
    bytes stderr = 3;
    // Final result. Set once, after the exec has exited.
    Result result = 4;

    message Result {
        // How long the exec ran.
        google.protobuf.Duration duration = 1;
        // Error text if the exec failed.
        string error = 2;
        // Process exit code. Zero means success.
        int32 exit_code = 3;
    }
}

message Cwd {
    string absolute           = 1;
    string workspace_relative = 2;
}

message EnvVar {
    string name           = 1;
    string value          = 2;
    string from_secret_id = 3;
}

message ValueOrSecret {
    bytes  value          = 1;
    string from_secret_id = 2;
}

message ServiceSpec {
    string            name                  = 1;  // Required and unique across services.
    string            description           = 2;
    RunCommand        command               = 3;  // Required. stdin is not supported.
    StartPolicy       start_policy          = 4;
    RestartPolicy     restart_policy        = 5;
    bool              prevent_idle_shutdown = 6;  // Prevents idle shutdown while the service process is active.
    repeated PortSpec ports                 = 7;  // Must be unique across all ports and services.

    enum StartPolicy {
        START_POLICY_UNSPECIFIED     = 0;  // Defaults to on boot.
        START_POLICY_ON_BOOT         = 1;  // Starts on creation and when the agent boots.
        START_POLICY_ON_HTTP_INGRESS = 2;  // Starts when one of the service's HTTP ingress ports is accessed.
        START_POLICY_MANUAL          = 3;  // Starts only through StartService.
    }

    enum RestartPolicy {
        RESTART_POLICY_UNSPECIFIED = 0;  // Defaults to on failure.
        RESTART_POLICY_NEVER       = 1;
        RESTART_POLICY_ON_FAILURE  = 2;  // Restarts after a non-zero exit.
        RESTART_POLICY_ALWAYS      = 3;  // Restarts after any exit.
    }
}

message Service {
    string        id        = 1;  // Assigned by the agent when persisted.
    ServiceSpec   spec      = 2;  // Required.
    repeated Port ports     = 3;
    Owner         owner     = 4;
    bool          stopped   = 5;  // Set by StopService. A stopped service does not start automatically and its ports are hidden until StartService.

    enum Owner {
        OWNER_UNSPECIFIED = 0;
        OWNER_USER        = 1;
        OWNER_NAMESPACE   = 2;  // Managed by Namespace and immutable through CRUD.
    }
}

message ServiceProcess {
    Status                    status     = 1;
    uint32                    pid        = 2;
    google.protobuf.Timestamp started_at = 3;
    Exit                      last_exit  = 4;
    uint32                    restarts   = 5;  // Process restarts since the service last started.
    string                    exec_id    = 6;  // Exec log for this service process.

    message Exit {
        int32                     code      = 1;
        string                    message   = 2;
        google.protobuf.Timestamp exited_at = 3;
    }

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_STARTING    = 1;
        STATUS_RUNNING     = 2;
        STATUS_STOPPING    = 3;
        STATUS_STOPPED     = 4;
        STATUS_FAILED      = 5;  // Exited and the agent gave up restarting.
        STATUS_RESTARTING  = 6;  // Exited and waiting to restart.
    }
}

message CreateServiceRequest {
    ServiceSpec       spec          = 1;
    InitialState      initial_state = 2;

    enum InitialState {
        INITIAL_STATE_UNSPECIFIED = 0;  // Follows the start policy.
        INITIAL_STATE_STARTED     = 1;  // Starts on creation regardless of the start policy, as StartService.
        INITIAL_STATE_STOPPED     = 2;  // Creates the service stopped, as StopService.
    }
}

message CreateServiceResponse {
    Service        service = 1;
    ServiceProcess process = 2;  // Set when creation starts the service. Launch failures are returned here.
}

message ListServicesRequest {}

message ListServicesResponse {
    message ListedService {
        Service        service = 1;
        ServiceProcess process = 2;  // Unset when the agent has no process state for the service.
    }

    repeated ListedService services = 1;
}

// Gracefully stops a running process and deletes the service after it exits.
// Forces the process after 15 seconds and returns DEADLINE_EXCEEDED if it has not exited after 20 seconds.
message DeleteServiceRequest {
    string id_or_name = 1;
}

message DeleteServiceResponse {}

// Clears stopped and starts the service regardless of its start policy. If already active, returns its current process.
message StartServiceRequest {
    string id_or_name = 1;
}

message StartServiceResponse {
    ServiceProcess process = 1;  // Launch failures are reported here, not as an error.
}

// Marks the service stopped and stops its process. If it is already stopped, succeeds.
message StopServiceRequest {
    string id_or_name = 1;
    Mode   mode       = 2;

    enum Mode {
        MODE_UNSPECIFIED = 0;  // Treated as MODE_GRACEFUL.
        MODE_GRACEFUL    = 1;  // Send SIGTERM, allowing cleanup.
        MODE_FORCE       = 2;  // Send SIGKILL immediately.
    }
}

message StopServiceResponse {
    ServiceProcess process = 1;  // May be unset, STOPPING, or STOPPED.
}

message SignalServiceRequest {
    string id_or_name = 1;
    int32  signal     = 2;
}

message SignalServiceResponse {}

// A configured port. Numbers and non-empty names are unique within each kind.
message PortSpec {
    string name   = 1;  // Optional.
    uint32 number = 2;  // Must be 1-65535 and not use a Namespace-reserved port.
    Kind   kind   = 3;  // KIND_UNSPECIFIED is invalid when persisted.

    enum Kind {
        KIND_UNSPECIFIED  = 0;
        KIND_PORT_FORWARD = 1;
        KIND_HTTP_INGRESS = 2; // Allows HTTP requests through devbox.so.
    }
}

message Port {
    string   id    = 1;
    PortSpec spec  = 2;
    Owner    owner = 3;

    enum Owner {
        OWNER_UNSPECIFIED = 0;
        OWNER_USER        = 1;
        OWNER_NAMESPACE   = 2;  // Managed by Namespace and immutable through CRUD.
    }
}

message CreatePortRequest {
    PortSpec spec = 1;
}

message CreatePortResponse {
    Port port = 1;
}

message DeletePortRequest {
    string id = 1;
}

message DeletePortResponse {}

message ListPortsRequest {
    repeated PortSpec.Kind kinds = 1;
}

message ListPortsResponse {
    repeated ListedPort ports = 1;
}

message ListedPort {
    Port port = 1;
}

message AgentBoot {
    repeated Op ops = 1;

    message Op {
        string name = 1;  // Optional.

        SetupNamespaceGitCredentials setup_namespace_git_credentials = 2;
        GitCheckout                  git_checkout                    = 3;
        GitCreateBranch              git_create_branch               = 4;
        GitSetUserAndEmail           git_set_user_and_email          = 5;
        RunCommand                   run_command                     = 6;
        RunScript                    run_script                      = 7;
        OnCreate                     on_create                       = 8;
        SetupDotfiles                setup_dotfiles                  = 9;
        SetupDocker                  setup_docker                    = 10;
        repeated Concurrent          concurrent                      = 11;
        EnsureSessions               ensure_sessions                 = 12;
        GitReset                     git_reset                       = 13;
        SetupIntegrations            setup_integrations              = 14;
        SetupEgressProxyCA           setup_egress_proxy_ca            = 15;
        AcceptingSSHConnections      accepting_ssh_connections        = 16;
        GitCheckoutRepositories      git_checkout_repositories        = 17;
        StartServices                start_services                   = 18;

        message SetupNamespaceGitCredentials {
            reserved 1;
            reserved "secret_id";

            repeated string repositories = 2;
        }

        message GitCheckout {
            string         repository       = 1;  // E.g. https://github.com/namespacelabs/internal.git
            string         workspace_target = 2;
            // Branch, tag, or commit SHA to check out. When empty, the
            // repository's default branch is used.
            string         ref              = 3;
            CheckoutMethod checkout_method  = 4;

            enum CheckoutMethod {
                CHECKOUT_METHOD_UNSPECIFIED         = 0;
                CHECKOUT_METHOD_GIT_CLONE           = 1;
                CHECKOUT_METHOD_GIT_SNAPSHOT_UNPACK = 2;
            }
        }

        message GitCheckoutRepositories {
            repeated GitCheckout repositories = 1;
        }

        message GitCreateBranch {
            string workspace_rel = 1;
            string branch_name   = 2;
        }

        message GitSetUserAndEmail {}

        message GitReset {
            // Branch, tag, or commit SHA to reset the existing checkout to.
            // When empty, the repository's default branch is used.
            string ref = 1;
        }

        message RunScript {
            string script = 1;
            repeated EnvVar additional_environment = 2;
            string run_as = 3;
            // If set, downloads the script from this URL instead of using `script`.
            string script_source = 4;
            // The interpreter to use (e.g., "bash", "python3").
            // Defaults to "/bin/sh" on Unix or Windows PowerShell with -File on Windows.
            string interpreter = 5;
        }

        message OnCreate {
            repeated Op ops = 1;
        }

        message SetupDotfiles {
            string workspace_target = 1;
        }

        message SetupDocker {
            string docker_dir = 1;
        }

        message Concurrent {
            repeated Op ops = 1;
        }

        message EnsureSessions {
            repeated AddTerminalSessionRequest sessions = 1;
        }

        message SetupIntegrations {
            DevinOutposts devin_outposts = 1;
            Cursor        cursor         = 2;
            ClaudeAgent   claude_agent   = 3;

            message DevinOutposts {
                string host              = 1;
                string remote_binary_sha = 2;
            }

            message Cursor {
                string worker_id  = 1;
                string pool_name  = 2;
                string request_id = 3;
            }

            message ClaudeAgent {}
        }

        message SetupEgressProxyCA {
            string ca_path = 1;
        }

        message AcceptingSSHConnections {}

        message StartServices {}
    }
}

message AgentStartup {
    reserved 4, 19;
    reserved "port_forwards", "claude_agent";

    string repository = 1;  // E.g. https://github.com/namespacelabs/internal.git
    string git_name   = 2;
    string git_email  = 3;

    string main_user     = 5;  // Which user to checkout as, who should own /workspace, etc.
    string shell         = 12;
    string workspace_dir = 6;  // Where /workspace is. Defaults to /workspace.
    string default_dir   = 7;  // For SSH purposes, for example.
    string user_persistency_dir = 13;

    AgentBoot       boot                = 8;
    repeated string authorized_ssh_keys = 9;

    string bake_image_ref = 10;

    repeated string include_in_path = 11;

    repeated SignificantMount significant_mounts = 14;

    repeated NamedPort named_ports = 15;

    VSCode vscode = 16;

    AgentRuntimeConfiguration initial_configuration = 17;

    bool enable_dbus = 18;

    repeated PortSpec    ports    = 21;
    repeated ServiceSpec services = 22;

    message VSCode {
        repeated string extensions = 1;
    }

    message NamedPort {
        string name = 1;
        int32 port = 2;
    }
}

message AgentRuntimeConfiguration {
    int32 version = 1;
    google.protobuf.Duration busy_ensure_minimum_duration = 2;
    TmuxConfiguration tmux = 3;
    AutomaticPortForwardingConfiguration automatic_port_forwarding = 4;

    message TmuxConfiguration {
        map<string, string> server_options = 1;
        map<string, string> global_options = 2;
    }

    message AutomaticPortForwardingConfiguration {
        repeated uint32 excluded_ports = 1;
    }
}

message SignificantMount {
    string path = 1;
    Kind kind = 2;

    enum Kind {
        KIND_UNKNOWN = 0;
        CACHE_VOLUME = 1;
        PERSISTENT_VOLUME = 2;
    }
}

message BootOpResult {
    string       op_id    = 1;
    Node         node     = 2;
    repeated Log log      = 3;
    Result       result   = 4;
    bool         complete = 5;

    message Node {
        string       name = 1;
        AgentBoot.Op op   = 2;
    }

    message Log {
        string stream  = 1;
        string message = 2;
    }

    message Result {
        google.protobuf.Duration duration = 1;
        string                   error    = 2;
    }
}

message StartupState {
    repeated BootOpResult boot_op_results = 1;
}

message QueryStateRequest {
    bool include_git_status = 1;
    string git_path = 2;
    ResourceMetricsSubscription resource_metrics = 3;
}

message ResourceMetricsSubscription {
    bool subscribe = 1;
    uint32 refresh_interval_ms = 2;  // Min 250ms (4Hz), max 10000ms. Default 1000ms.
}

message QueryStateResponse {
    repeated SignificantMountState mount_states     = 1;
    GitStatus                      git_status       = 2;
    repeated GitWorktree           worktrees        = 3;
    ResourceMetrics                resource_metrics = 4;
    repeated Repository            repositories     = 5; // Full per-checkout snapshots, omitted on updates unrelated to repositories.

    message SignificantMountState {
        SignificantMount mount = 1;
        uint64 total_bytes     = 2;
        uint64 available_bytes = 3;
        uint64 free_bytes      = 4;
    }

    message Repository {
        string               repository       = 1;
        string               workspace_target = 2; // Relative to AgentStartup.workspace_dir.
        GitStatus            git_status       = 3; // Absent when status is not requested or cannot be collected.
        repeated GitWorktree worktrees        = 4;
    }
}

message GitStatus {
    string current_branch = 1;
    repeated File tracked_files = 2;
    repeated File untracked_files = 3;
    repeated Commit local_commits = 4;

    message File {
        string path = 1;
        string status = 2;
        int32 lines_added = 3;
        int32 lines_removed = 4;
        uint64 file_size_bytes = 5;
        repeated Flag flags = 6;

        enum Flag {
            FLAG_UNKNOWN = 0;
            BINARY = 1;
        }
    }

    message Commit {
        string digest = 1;
        string subject = 2;
        string author = 3;
        google.protobuf.Timestamp author_date = 4;
        google.protobuf.Timestamp commit_date = 5;
    }
}

message WebSocketSSHInitiation {
    string user = 1; // Optional.
    bytes private_key = 2;
    repeated string command = 3; // Optional. If set, runs the specified command instead of an interactive shell.
    string session = 4; // Optional. If set, connects to a named tmux session.
    bool exclusive_session = 5; // If true, disconnects other users from the same tmux session.
    repeated string terminal_capabilities = 6; // Terminal features supported by the connecting client.
    string session_initializer = 7; // Optional. Runs in the session shell when creating a session.
}

message RunOutputChunk {
    bytes  stdout = 1;
    bytes  stderr = 2;
    Result result = 3;

    message Result {
        google.protobuf.Duration duration  = 1;
        string                   error     = 2;
        int32                    exit_code = 3;
    }
}

message GitWorktree {
    string path = 1;
    string branch = 2;
    string commit = 3;
    bool is_bare = 4;
    bool is_detached = 5;
}

message ListGitWorktreesRequest {
    string workspace_relative = 1;
}

message ListGitWorktreesResponse {
    repeated GitWorktree worktrees = 1;
}

message CreateGitWorktreeRequest {
    string workspace_relative = 1;
    string path = 2;
    string ref = 3;
    bool detach = 4;
}

message CreateGitWorktreeResponse {
    string path = 1;
    string branch = 2;
    string commit = 3;
}

message RemoveGitWorktreeRequest {
    string workspace_relative = 1;
    string path = 2;
    bool force = 3;
}

message ListTerminalSessionsResponse {
    repeated TerminalSession sessions = 1;
}

message TerminalSession {
    string                    name        = 1;
    int32                     windows     = 2;
    google.protobuf.Timestamp created_at  = 3;
    bool                      attached    = 4;
    string                    emoji       = 5;
    RunCommand                run_command = 6;
    RunScript                 run_script  = 7;
    bool                      protected   = 8;

    message RunCommand {
        string          command = 1;
        repeated string args    = 2;
    }

    message RunScript {
        string script = 1;
    }
}

message AddTerminalSessionRequest {
    string name = 1;
    string emoji = 2;
    TerminalSession.RunCommand run_command = 3;
    TerminalSession.RunScript  run_script  = 4;
}

message DeleteTerminalSessionRequest {
    string name = 1;
}

message ResourceMetrics {
    CpuMetrics cpu = 1;
    MemoryMetrics memory = 2;
    google.protobuf.Timestamp timestamp = 3;

    message CpuMetrics {
        double total_percent = 1;
        repeated PerCpuMetrics per_cpu = 2;
        int32 num_cores = 3;

        message PerCpuMetrics {
            int32 core_id = 1;
            double percent = 2;
            double user = 3;
            double system = 4;
            double idle = 5;
            double iowait = 6;
        }
    }

    message MemoryMetrics {
        uint64 total_bytes = 1;
        uint64 available_bytes = 2;
        uint64 used_bytes = 3;
        double used_percent = 4;
        uint64 free_bytes = 5;
        uint64 buffers_bytes = 6;
        uint64 cached_bytes = 7;
        uint64 swap_total_bytes = 8;
        uint64 swap_free_bytes = 9;
        uint64 swap_used_bytes = 10;
    }
}

message ResetForLeaseRequest {
    string         lease_id        = 1;
    VersionControl version_control = 2;

    message VersionControl {
        GitCheckout    git_checkout    = 1;
        GitCredentials git_credentials = 2;

        message GitCheckout {
            string repository = 1;
            string ref        = 2;
        }

        message GitCredentials {
            string secret_id = 1;
        }
    }
}

message ResetForLeaseEvent {
    string       step_id  = 1;  // Stable id for ordering/dedup.
    string       step     = 2;  // Human label, e.g. "discard changes", "checkout".
    repeated Log log      = 3;  // Streamed stdout/stderr.
    Result       result   = 4;  // Terminal for a step: duration or error.
    bool         complete = 5;  // Final event for the whole reset.

    message Log {
        string stream  = 1;  // "stdout" | "stderr"
        string message = 2;
    }

    message Result {
        google.protobuf.Duration duration = 1;
        string                   error    = 2;
    }
}
