}

message VersionControlAuthor {
    string name  = 1;
    string email = 2;
}

message VersionControlSpec {
    string         git_repository  = 1;
    string         ref             = 2; // Branch, tag, or commit SHA to check out. When empty, the repository's default branch is used.
    CheckoutMethod checkout_method = 3;

    // WIP: multi-repo support that will deprecate fields above. Not yet ready!
    repeated GitRepositorySpec repositories = 4;

    message GitRepositorySpec {
        string                            repository      = 1;
        string                            ref             = 2; // Branch, tag, or commit SHA to check out. When empty, the repository's default branch is used.
        VersionControlSpec.CheckoutMethod checkout_method = 3;
    }

    enum CheckoutMethod {
        CHECKOUT_METHOD_UNSPECIFIED         = 0;
        CHECKOUT_METHOD_GIT_CLONE           = 1;
        CHECKOUT_METHOD_GIT_SNAPSHOT_UNPACK = 2;
    }
}

message BlueprintSpec {
    string               remote_user     = 1;
    string               shell           = 13;
    repeated PortForward port_forwards   = 2;
    bool                 privileged      = 3;
    repeated string      cap_add         = 4;
    repeated string      security_opt    = 5;
    repeated EnvVar      environment     = 6;
    repeated Op          on_create       = 7;
    repeated Op          on_startup      = 8;
    repeated string      include_in_path = 14;
    repeated Volume      volumes         = 15;
    bool                 whole_system_persistency = 16;

    string cache_volume_tag     = 9;
    int64  cache_volume_size_gb = 10;

    UserOrUid docker_sock_user    = 11;
    bool      setup_docker_client = 12;

    string workspace_dir = 17;
    // Terminal sessions to create at startup.
    repeated SessionSpec sessions = 18;

    message PortForward {
        int32  port  = 1;
        string label = 2;
    }

    message EnvVar {
        string name           = 1;
        string value          = 2;
        string from_secret_id = 3;
    }

    message Op {
        RunCommand run_command = 1;
        RunScript  run_script  = 2;

        message RunCommand {
            string          command = 1;
            repeated string args    = 2;
        }

        message RunScript {
            string script = 1;
        }
    }

    message UserOrUid {
        int32  uid  = 1;
        string user = 2;
    }

    message Volume {
        string mount_path  = 1;
        string volume_name = 2;
    }

    message SessionSpec {
        string name    = 1;
        string emoji   = 2;
        string command = 3;
    }
}

