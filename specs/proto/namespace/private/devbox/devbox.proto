        repeated string platforms = 3;  // Canonical OS/architecture values, such as "linux/amd64" or "macos/arm64".
    }
}

// FeatureSpec represents the changes to apply when a feature is enabled.
message FeatureSpec {
    // Scripts to run during devbox creation.
    repeated RunScript on_create = 1;
    // Terminal sessions to create.
    repeated SessionSpec sessions = 2;
    // Paths to add to PATH.
    repeated string include_in_path = 3;
    // Named ports to export from the devbox container.
    repeated ExportedPort exported_ports = 4;
    // Scripts to run on every devbox startup (not just first boot).
    repeated RunScript on_startup = 5;

    message RunScript {
        string name   = 1;
        string script = 2;
        // If set, downloads the script from this URL and runs it with the interpreter.
        // This replaces patterns like "curl -fsSL https://example.com/install.sh | bash".
        string script_source = 3;
        // The interpreter to use when running the script (e.g., "bash", "sh", "python3").
        // If not set, defaults to "/bin/sh" on Unix or Windows PowerShell with -File on Windows.
        string interpreter = 4;
    }

    message SessionSpec {
        string name    = 1;
        string emoji   = 2;
        string command = 3;
    }

    message ExportedPort {
        string name = 1;
        int32 port = 2;
    }
}

message UpdateRequest {
    string                                       name                        = 1;
    namespace.cloud.compute.v1beta.InstanceShape instance_shape              = 2;
    google.protobuf.Duration                     busy_ensure_minimum_duration = 3;
    // If set, updates the persisted integrations config for this devbox.
    Integrations                                 integrations                = 4;
    // If > 0, requests resizing the persistent volume to this size. Must be
    // greater than or equal to the current size and not exceed the tenant
    // policy's maximum volume size. Cannot shrink. Applies on next devbox
    // restart.
    int64                                        volume_size_gb              = 5;
    // If set, updates the persisted privileged flag. Applies on next restart.
    google.protobuf.BoolValue                    privileged                  = 6;
    // If set, updates the persisted network policy. Applies on next restart.
    // An empty NetworkPolicySpec{} clears the stored policy.
    NetworkPolicySpec                            network_policy              = 7;
    // If set, updates access to this devbox through devbox.so URLs.
    HttpAccessMode                               http_access_mode            = 8;
}

message UpdateResponse {
    DevBox devbox = 1;
}

message DevboxDefaults {
    namespace.cloud.compute.v1beta.InstanceShape instance_shape              = 1;
    string                                       image_name                  = 2;
    VersionControlSpec                           version_control             = 3;
    google.protobuf.Duration                     busy_ensure_minimum_duration = 4;
    AccessMode                                   access_mode                 = 5;
    Integrations                                 integrations                = 6;
    repeated string                              enabled_features            = 7;
    // Default persistent volume size in GB applied to new devboxes when the
    // create request doesn't specify a size. Capped at the tenant policy's
    // maximum_volume_size_gb. 0 means use the system default.
    int64                                        volume_size_gb              = 8;
    NetworkPolicySpec                            network_policy              = 9;
}

message UpdateDefaultsRequest {
    DevboxDefaults defaults            = 1;
    int64          match_metadata_version = 2;
}

message UpdateDefaultsResponse {
    DevboxDefaults defaults = 1;
}

message FetchDefaultsRequest {}

message FetchDefaultsResponse {
    DevboxDefaults defaults          = 1;
    int64          metadata_version  = 2;
    // Values explicitly set via tenant policy.
    DevboxDefaults by_policy         = 3;
}

message CreateRepositoryRequest {
    string repository = 1;
}

message CreateRepositoryResponse {}

message Features {
    repeated string enabled = 1;
}

message NetworkPolicySpec {
    // If set, restrict outbound network access to the listed domains.
    // Namespace infrastructure domains are always included.
    EgressDomains egress_domains = 1;

    // If set, apply the reusable workspace egress policy identified by tag.
    // Mutually exclusive with egress_domains.
    EgressPolicy egress_policy = 2;

    message EgressDomains {
        // Prefix a domain with "*." to include all of its subdomains.
        repeated string allowed = 1;

        // If true, log egress decisions but don't block.
        bool advisory = 2;
    }

    message EgressPolicy {
        string tag = 1;
    }
}

message Integrations {
    TailscaleIntegration tailscale      = 1;
    ClaudeIntegration    claude         = 2;

    message TailscaleIntegration {
        // Name of a tenant-level Tailscale integration spec (defined in tenant policy
        // under integrations.tailscale). Use `nsc integrations tailscale list` to see
        // available specs. The oauth_client_id and tags are resolved from the policy spec.
        string from_spec = 1;
    }

    message ClaudeIntegration {
        string integration_id    = 1;
        string claude_session_id = 2;
    }
}

message CreateIntegrationRequest {
    ClaudeIntegrationSpec claude = 1;
}

message CreateIntegrationResponse {
    string id = 1;
}

message ListIntegrationsRequest {}

message ListIntegrationsResponse {
    repeated Integration integrations = 1;
}

message DeleteIntegrationRequest {
    string id = 1;
}

message DeleteIntegrationResponse {}

// Stored view of an integration. Exactly one spec field is populated.
message Integration {
    string                    id         = 1;
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Timestamp updated_at = 3;

    ClaudeIntegrationSpec claude = 4;
}

// Depending on the situation, fields may not be returned.
message ClaudeIntegrationSpec {
    string claude_api_key             = 1;
    string claude_environment_id      = 2;
    string claude_environment_key     = 3;
    string claude_webhook_signing_key = 4;
    string nsc_webhook_id             = 5; // unique id in the webhook endpoint to identifier the caller
}
