syntax = "proto3";

package namespace.cloud.iam.v1beta;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "proto/namespace/cloud/iam/v1beta/authz.proto";

// TokenService provides facilities to obtain "tokens" to authenticate access to
// Namespace. Tokens emitted by TokenService are always Tenant-scoped.
//
// It allows, for example, exchanging tenant tokens for OIDC tokens to identify
// Namespace workloads with external audiences.
//
// You can also create revokable tokens that can be used as more traditional API
// keys.
//
// ## Access
//
// IAM services are available over gRPC and HTTP on the following endpoint:
//
// ```
// https://iam.namespaceapis.com:443
// ```
//
// See [the overview](https://buf.build/namespace/cloud) for examples accessing
// the API from the console.
//
// ## SDKs and Examples
//
// **Go SDK**: [namespacelabs.dev/integrations](https://github.com/namespacelabs/integrations) —
// provides ready-to-use gRPC clients and authentication helpers.
//
// **TypeScript SDK**: [@namespacelabs/sdk](https://github.com/namespacelabs/typescript-sdk) —
// provides typed clients, authentication, and token management for Node.js.
//
// **Examples** (Go, TypeScript):
// [ensuretenant](https://github.com/namespacelabs/examples/tree/master/go/ensuretenant),
// [iam-demo](https://github.com/namespacelabs/examples/tree/master/typescript/iam-demo).
//
// ## Authentication
//
// Most calls to the Token service require providing a JWT as a Bearer token,
// signed by the Namespace platform.
//
// Tenant tokens issued by Tenant service can be used as such Bearer tokens. The
// token can be used as to authenticate calls to Token API with Authorization
// header:
//
// ```
// Authorization: Bearer {token}
// ```
service TokenService {
  // Exchange a Namespace tenant token for an OIDC token for identity federation.
  // The generated token identifies Namespace tenants with the provided target audience.
  //
  // ### Authentication
  // Requires a tenant token with the {"federation", "issue_federation"} action permission.
  //
  // ### Errors
  // - If no audience is provided, a `InvalidArgument` status is returned.
  rpc IssueIdToken(IssueIdTokenRequest) returns (IssueIdTokenResponse);

  // Produces credentials in the form of a Bearer token that grant access to
  // the specified Tenant. The credentials provided to the `IssueTenantToken`
  // call are validated to verify they are capable of requesting credentials.
  //
  // ### Authentication
  // Requires a "partner token".
  rpc IssueTenantToken(IssueTenantTokenRequest) returns (IssueTenantTokenResponse);

  // Produces credentials in the form of a Bearer token that grant access to
  // the specified Tenant using an OIDC token from a trusted issuer.
  //
  // ### Authentication
  // This call authenticates using the `oidc_token` provided in the request.
  rpc IssueTenantTokenWithOIDC(IssueTenantTokenWithOIDCRequest) returns (IssueTenantTokenResponse);

  // Creates a revokable token that returns a bearer token (prefixed with "nsrt_") and metadata (with token_id prefixed with "tok_").
  // Revokable tokens can be explicitly revoked and have a maximum expiration of 1 year when an expiration is set.
  // Membership-scoped tokens may have no expiration and remain valid until revoked or the user loses tenant membership.
  //
  // ### Authentication
  // Requires a tenant token with the {"token/revokable", "create"} action permission.
  //
  // ### Errors
  // - If expiry is not provided for a tenant-scoped token or exceeds 1 year, an `InvalidArgument` status is returned.
  // - If no policies are defined, an `InvalidArgument` status is returned.
  rpc CreateRevokableToken(CreateRevokableTokenRequest) returns (CreateRevokableTokenResponse);

  // Ensures a revokable token has at least the requested remaining lifetime.
  // Refreshing does not return a new bearer token; it updates the existing token's expiry in place.
  //
  // ### Authentication
  // Requires a tenant token with the {"token/revokable", "refresh"} action permission.
  //
  // ### Errors
  // - If `minimum_duration` is missing, non-positive, or exceeds 1 year, an `InvalidArgument` status is returned.
  // - If the token_id is not found or already revoked, a `NotFound` status is returned.
  // - If the token has already expired, a `FailedPrecondition` status is returned.
  rpc RefreshRevokableToken(RefreshRevokableTokenRequest) returns (RefreshRevokableTokenResponse);

  // Revokes a revokable token by its token_id (prefixed with "tok_"), preventing the associated bearer token from being used for authentication.
  // Records who revoked the token and when.
  //
  // ### Authentication
  // Requires a tenant token with the {"token/revokable", "revoke"} action permission.
  //
  // ### Errors
  // - If the token_id is not found or already revoked, a `NotFound` status is returned.
  rpc RevokeRevokableToken(RevokeRevokableTokenRequest) returns (google.protobuf.Empty);

  // Lists all revokable tokens for the authenticated tenant.
  //
  // ### Authentication
  // Requires a tenant token with the {"token/revokable", "list"} action permission.
  rpc ListRevokableTokens(ListRevokableTokensRequest) returns (ListRevokableTokensResponse);

  // Batch revokes multiple revokable tokens based on filter criteria.
  // At least one filter must be provided.
  //
  // ### Authentication
  // Requires a tenant token with the {"token/revokable", "revoke"} action permission.
  //
  // ### Errors
  // - If no filters are provided, an `InvalidArgument` status is returned.
  rpc BatchRevokeRevokableToken(BatchRevokeRevokableTokenRequest) returns (BatchRevokeRevokableTokenResponse);
}

message IssueIdTokenRequest {
  // Target audience for the generated identity token.
  string audience = 1;
}

message IssueIdTokenResponse {
  // The signed OIDC ID token. Use this token to authenticate with external
  // services that trust the Namespace federation issuer
  // (`https://federation.namespaceapis.com`).
  string id_token = 1;
}

message IssueTenantTokenRequest {
  // Which tenant credentials should be produced for.
  string tenant_id = 1;

  // A integration-specified identifier that represents the user that is
  // requesting these credentials. The actor identity is embedded into the
  // verifiable claims of the resulting JWT.
  string actor_id = 2;

  // For how long should the resulting credentials be valid for. If not
  // specified, a short-lived default is used (e.g 15mins).
  int64 duration_secs = 3;

  // A set of policies that apply to this tenant token.
  repeated TenantTokenPolicy policies = 4;

  // Configure the access permissions available with this token.
  AccessPolicy access = 5;
}

message AccessPolicy {
  // Grant a restricted set of permissions to this token.
  // See https://namespace.so/docs/security/permissions for available permissions.
  repeated Permission grants = 1;
}

message IssueTenantTokenResponse {
  // The tenant Bearer token. Pass this in the `Authorization: Bearer {token}`
  // header when calling Namespace APIs.
  string bearer_token = 1;
}

message IssueTenantTokenWithOIDCRequest {
  // Which tenant credentials should be produced for.
  string tenant_id = 1;

  // The OIDC token from a trusted external issuer.
  string oidc_token = 2;

  // For how long the resulting credentials should be valid.
  google.protobuf.Duration duration = 3;
}

message TenantTokenPolicy {
  // The policy type being set.
  //
  // Consult with the Namespace team on which controls can be applied per tenant token.
  string policy_type = 1;

  // The policy-specific value. It may be a string, number, or serialized
  // message (e.g. JSON).
  string value = 2;
}

message CreateRevokableTokenRequest {
  // A unique name for the token within the tenant. Required.
  string name = 1;

  // A human-readable description of the token's purpose.
  string description = 2;

  // When the token should expire. Maximum expiration is 1 year from creation.
  // May be omitted for membership-scoped tokens to create a token with unlimited duration.
  google.protobuf.Timestamp expires_at = 3;

  // A set of policies that apply to this token.
  repeated TenantTokenPolicy policies = 4;

  // Configure the access permissions available with this token.
  AccessPolicy access = 5;

  // Allows restricting the scope of the issued token.
  RevokableToken.Scope scope = 6;
}

message CreateRevokableTokenResponse {
  // The bearer token that can be used for authentication.
  // This value is only returned once at creation time and
  // cannot be retrieved later.
  string bearer_token = 1;

  // The token metadata, including the token_id (prefixed with "tok_") which
  // can be used to revoke or list the token.
  RevokableToken token = 2;
}

message RefreshRevokableTokenRequest {
  // The unique identifier of the token to refresh, prefixed with "tok_".
  string token_id = 1;

  // Ensure the token remains valid for at least this much longer.
  // Maximum duration is 1 year.
  google.protobuf.Duration minimum_duration = 2;
}

message RefreshRevokableTokenResponse {
  // The refreshed token metadata.
  RevokableToken token = 1;
}

message RevokeRevokableTokenRequest {
  // The unique identifier of the token to revoke, prefixed with "tok_".
  string token_id = 1;
}

message ListRevokableTokensRequest {
  // If a previous response returned a `pagination_cursor`, it can be
  // specified to continue reading results with the same arguments as the
  // original call.
  bytes pagination_cursor = 1;

  // The maximum number of entries to return as part of this ListRevokableTokens
  // request. A maximum number of entries may also be specified when
  // `pagination_cursor` is set.
  //
  // We won't return more than `max_entries`, but may return fewer.
  int64 max_entries = 2;

  // If true, include revoked tokens in the results.
  bool include_revoked = 3;
}

message ListRevokableTokensResponse {
  // The list of revokable tokens.
  repeated RevokableToken tokens = 1;

  // If set, there are additional results. Pass the same cursor to a
  // subsequent ListRevokableTokens call to continue fetching results.
  bytes pagination_cursor = 2;
}

message RevokableToken {
  // The unique identifier for this token, prefixed with "tok_". This is used for revocation.
  string token_id = 1;

  // The tenant this token belongs to.
  string tenant_id = 2;

  // A unique name for the token within the tenant.
  string name = 3;

  // A human-readable description of the token's purpose.
  string description = 4;

  // When the token was created.
  google.protobuf.Timestamp created_at = 5;

  // When the token expires. Tokens are implicitly invalid after this time.
  // If omitted, the membership-scoped token has unlimited duration.
  google.protobuf.Timestamp expires_at = 6;

  // If set, when the token was explicitly revoked.
  google.protobuf.Timestamp revoked_at = 7;

  // If set, the actor who revoked the token.
  string revoked_by_actor_id = 8;

  // The actor who created this token.
  string creator_actor_id = 9;

  // Indicates whether the token is bound to a particular membership, or tenant-wide.
  Scope scope = 10;

  // The permissions granted to this token.
  repeated Permission permissions = 11;

  enum Scope {
    SCOPE_UNKNOWN = 0;
    TENANT_SCOPE = 1; // default scope if not selected
    TENANT_MEMBERSHIP_SCOPE = 2;
  }

  // The current state of the token.
  State state = 12;

  enum State {
    STATE_UNKNOWN = 0;
    ACTIVE = 1;
    REVOKED = 2;
    EXPIRED = 3;
  }
}

message BatchRevokeRevokableTokenRequest {
  // Revoke tokens created before this timestamp.
  // If not set, no time-based filtering is applied.
  google.protobuf.Timestamp before = 1;

  // Revoke tokens created by this actor_id (only applies to user actors).
  // If not set, no actor-based filtering is applied.
  string created_by_actor_id = 2;

  // Revoke tokens with the selected scope only.
  // If not set, no scope-based filtering is applied.
  RevokableToken.Scope scope = 3;
}

message BatchRevokeRevokableTokenResponse {
  // The IDs of the tokens that were revoked (prefixed with "tok_").
  repeated string revoked_token_ids = 1;
}
