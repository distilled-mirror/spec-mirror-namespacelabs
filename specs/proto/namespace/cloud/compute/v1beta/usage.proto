syntax = "proto3";

package namespace.cloud.compute.v1beta;

import "proto/namespace/stdlib/matchers.proto";
import "google/protobuf/timestamp.proto";
import "proto/namespace/stdlib/timeseries.proto";
import "proto/namespace/cloud/compute/v1beta/concurrency.proto";

// UsageService allows querying the compute instance usage of a tenant.
//
// ## Access
//
// Like ComputeService, UsageService is regionalized for fault tolerance.
// Each of the regional API endpoints offers a view into the compute instances
// running at that location. Reach out to Namespace team at support@namespace.so
// for a list of available regions.
//
// ```
// https://{region}.compute.namespaceapis.com:443
// # E.g.:
// https://eu.compute.namespaceapis.com:443
// https://us.compute.namespaceapis.com:443
// ```
//
// ## Authentication
//
// Calls to the UsageService require a *tenant token* passed as a Bearer token as
// part of each call. These are always required.
//
// A *tenant token* identifies both the workspace that the call operates on, but
// may also constrain the set of actions that the caller may do.
//
// A *tenant token* can be obtained using the
// [IAM API](https://buf.build/namespace/cloud/docs/main:namespace.cloud.iam.v1beta).
service UsageService {
    // Returns the compute usage of a tenant starting from the provided start date. If no start
    // date is provided, then it returns the compute usage starting from first day of the
    // current month.
    rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

    // Returns volume usage of a tenant starting from the provided start date. This covers both
    // cache volumes (active snapshot and at-rest storage) and persistent (block) volumes (at-rest
    // storage). If no start date is provided, then it returns usage starting from the first day of
    // the current month.
    rpc GetVolumeUsage(GetVolumeUsageRequest) returns (GetVolumeUsageResponse);

    // Returns object storage usage per product (at-rest storage and reads) of a tenant starting
    // from the provided start date. If no start date is provided, then it returns usage starting
    // from the first day of the current month.
    rpc GetArtifactUsage(GetArtifactUsageRequest) returns (GetArtifactUsageResponse);

    // Returns compute usage as a time series for the specified time range.
    // Supports filtering and breaking down results by various dimensions.
    rpc GetUsageTimeSeries(GetUsageTimeSeriesRequest) returns (GetUsageTimeSeriesResponse);

    // Generates a detailed report listing every compute instance created within
    // the specified time period. Results are streamed in batches for efficiency.
    //
    // Execution is constrained to 30 seconds, but supports downloading any
    // number of records within that window.
    rpc GenerateReport(GenerateReportRequest) returns (stream GenerateReportResponse);

    // Returns a point-in-time view of active compute resources and limits, grouped by
    // concurrency pool. Pools can overlap, so clients should not sum their usage.
    rpc GetConcurrency(GetConcurrencyRequest) returns (GetConcurrencyResponse);
}

message GetUsageRequest {
    // Optional: If no start date is provided, then return the compute usage starting from
    // first day of the current month.
    // Period start is inclusive.
    Date period_start = 1;

    // Optional: Limits the time range of the returned results. Period end is inclusive.
    // Period end has to be in the same month as period start.
    Date period_end = 2;

    // Optional: Only include usage from instances matching the specified platform (e.g. "linux/amd64").
    namespace.stdlib.StringMatcher match_platform = 3;

    // Optional: Only include usage from instances matching the specified shape (e.g. "2x8").
    namespace.stdlib.StringMatcher match_shape = 4;

    // Optional: Only include usage from instances matching the specified GitHub profile.
    namespace.stdlib.StringMatcher match_github_profile = 5;

    // Optional: Only include usage from instances matching the specified GitHub repository.
    namespace.stdlib.StringMatcher match_github_repository = 6;

    message Date {
        int32 year  = 1;  // e.g. 2023
        int32 month = 2;  // 1-12
        int32 day   = 3;  // 1-31
    }
}

message GetUsageResponse {
    // Cumulated usage summary for the current billing period.
    UsageRecord.Usage total = 1;
    // Detailed usage summary for the current billing period, broken down per day.
    repeated UsageRecord per_day = 2;
}

message UsageRecord {
    int32 year  = 1;  // e.g. 2023
    int32 month = 2;  // 1-12
    int32 day   = 3;  // 1-31
    Usage total = 4;

    message Usage {
        Minutes instance_minutes = 1;
        Builds  builds           = 2;
    }

    message Minutes {
        // A compute unit represents using 1 vCPU and 2GB of RAM for a minute.
        // E.g. An instance with 4 vCPU and 8GB RAM that runs for two minutes amounts for
        // two wall minutes and eight unit minutes.
        int64 unit = 1;

        // Wall minutes represent the total elapsed time for which instances have been running.
        int64 wall = 2;
    }

    message Builds {
        // The count represents the amount of build requests that were processed in the given period.
        int64 count = 1;

        // A build unit represents using a build machine with 1 vCPU and 2GB of RAM for a minute.
        // E.g. An builder with 4 vCPU and 8GB RAM that runs for two minutes amounts for
        // two wall minutes and eight unit minutes.
        int64 unit_minutes = 2;

        // Wall minutes represent the total elapsed time for which build machines have been running.
        // E.g. A build starts at 12:30 and lasts 5 minutes. Another build starts at 12:32 and lasts 7 minutes,
        // the reported wall time is 9 minutes, as the build machine is used from 12:30 until 12:39.
        int64 wall_minutes = 3;
    }
}

message GetVolumeUsageRequest {
    // Optional: If no start date is provided, then return usage starting from the first day of
    // the current month. Period start is inclusive.
    GetUsageRequest.Date period_start = 1;

    // Optional: Limits the time range of the returned results. Period end is inclusive.
    // Period end has to be in the same month as period start.
    GetUsageRequest.Date period_end = 2;
}

message GetVolumeUsageResponse {
    // Cumulated volume usage for the requested period.
    VolumeUsage total = 1;

    message VolumeUsage {
        // Active cache volume snapshot usage, in GB-minutes.
        // Divide by 60 for GB-hours.
        int64 cache_snapshot_gb_minutes = 1;

        // At-rest cache volume storage, in MB-minutes.
        // Divide by (1024 * 60 * 24) for GB-days.
        int64 cache_storage_mb_minutes = 2;

        // At-rest persistent (block) volume storage, in GB-minutes.
        // Divide by (60 * 24) for GB-days.
        int64 persistent_volume_storage_gb_minutes = 3;
    }
}

// ArtifactProduct enumerates the object storage products reported by GetArtifactUsage.
enum ArtifactProduct {
    ARTIFACT_PRODUCT_UNSPECIFIED = 0;
    ARTIFACT_PRODUCT_REGISTRY = 1;
    ARTIFACT_PRODUCT_TURBOREPO = 2;
    ARTIFACT_PRODUCT_GITHUB_ARTIFACTS = 3;
    ARTIFACT_PRODUCT_BAZEL = 4;
    ARTIFACT_PRODUCT_GRADLE = 5;

    // Combined GitHub Actions artifacts and artifacts uploaded through ArtifactsService,
    // including `nsc artifact`.
    ARTIFACT_PRODUCT_ARTIFACTS = 6;
}

message GetArtifactUsageRequest {
    // Optional: If no start date is provided, then return usage starting from the first day of
    // the current month. Period start is inclusive.
    GetUsageRequest.Date period_start = 1;

    // Optional: Limits the time range of the returned results. Period end is inclusive.
    // Period end has to be in the same month as period start.
    GetUsageRequest.Date period_end = 2;

    // Optional: Restricts the results to the given products. If empty, usage for all known object
    // storage products is returned. ARTIFACT_PRODUCT_UNSPECIFIED is not a valid entry.
    repeated ArtifactProduct products = 3;
}

message GetArtifactUsageResponse {
    // Per-product object storage usage for the requested period.
    repeated ProductUsage products = 1;

    message ProductUsage {
        // The object storage product.
        ArtifactProduct product = 1;

        // At-rest storage, in GB-minutes.
        // Divide by (60 * 24 * 30) for GB-months.
        int64 storage_gb_minutes = 2;

        // Reads (bytes sent), in bytes.
        int64 reads_bytes = 3;
    }
}

message GetUsageTimeSeriesRequest {
    // Required: Start of the time range (inclusive).
    google.protobuf.Timestamp start_time = 1;

    // Required: End of the time range (exclusive).
    google.protobuf.Timestamp end_time = 2;

    // Optional: Filter the usage data.
    UsageFilter filter = 3;

    // Optional: Break down results by the given dimension names.
    // When set, the response will contain a separate time series per unique
    // combination of breakdown values.
    // Valid values: "platform", "shape", "purpose", "github_repository", "github_branch", "github_workflow_name", "github_job_name",
    // "buildkite_org_id", "buildkite_pipeline_id", "buildkite_pipeline_slug", "buildkite_repository", "buildkite_branch",
    // "buildkite_job_name", "buildkite_job_state".
    repeated string breakdown_by = 4;

    message UsageFilter {
        namespace.stdlib.StringMatcher platform              = 1;
        namespace.stdlib.StringMatcher shape                 = 2;
        namespace.stdlib.StringMatcher purpose               = 3;
        namespace.stdlib.StringMatcher github_repository     = 4;
        namespace.stdlib.StringMatcher github_branch         = 5;
        namespace.stdlib.StringMatcher github_workflow_name  = 6;
        namespace.stdlib.StringMatcher github_job_name       = 7;
        namespace.stdlib.StringMatcher github_profile        = 8;
        namespace.stdlib.StringMatcher github_job_conclusion = 9;
        namespace.stdlib.StringMatcher buildkite_org_id        = 10;
        namespace.stdlib.StringMatcher buildkite_pipeline_id   = 11;
        namespace.stdlib.StringMatcher buildkite_pipeline_slug = 12;
        namespace.stdlib.StringMatcher buildkite_repository    = 13;
        namespace.stdlib.StringMatcher buildkite_branch        = 14;
        namespace.stdlib.StringMatcher buildkite_job_name      = 15;
        namespace.stdlib.StringMatcher buildkite_job_state     = 16;
    }
}

message GetUsageTimeSeriesResponse {
    namespace.stdlib.TimeSeries time_series = 1;
}

message GenerateReportRequest {
    // Required: Start of the time range (inclusive). Only instances created
    // within [start_time, end_time) will be included in the report.
    google.protobuf.Timestamp start_time = 1;

    // Required: End of the time range (exclusive).
    google.protobuf.Timestamp end_time = 2;

    // Optional: Filter the report.
    GetUsageTimeSeriesRequest.UsageFilter filter = 3;
}

message GenerateReportResponse {
    // A batch of report entries. The server may emit any number of entries per
    // streamed message; clients should concatenate entries across messages.
    repeated InstanceReportEntry entries = 1;
}

message InstanceReportEntry {
    string instance_id = 1;

    google.protobuf.Timestamp created_at   = 2;
    google.protobuf.Timestamp started_at   = 3;
    google.protobuf.Timestamp destroyed_at = 4;

    float resources_cpu                       = 5;
    float resources_ram_gb                    = 6;
    // Maximum observed CPU utilization, expressed as a ratio in [0.0, 1.0] of a
    // single vCPU (e.g. 1.0 means at least one vCPU was fully utilized).
    float resources_cpu_actual_max            = 7;
    // Maximum observed RAM utilization, expressed as a ratio in [0.0, 1.0] of
    // the instance's allocated memory.
    float resources_ram_gb_actual_max_percent = 8;

    // Set when the instance backed a GitHub Actions job.
    GitHubJob github_job = 9;

    // Metadata about all volumes attached to this instance.
    repeated Volume volumes = 10;

    // Set when the instance backed a Buildkite job.
    BuildkiteJob buildkite_job = 11;

    message GitHubJob {
        int64  job_id        = 1;
        string job_name      = 2;
        string workflow_name = 3;
        int64  run_id        = 4;
        int64  run_attempt   = 5;

        google.protobuf.Timestamp job_created_at   = 6;
        google.protobuf.Timestamp job_started_at   = 7;
        google.protobuf.Timestamp job_completed_at = 8;

        string profile    = 9;
        string repository = 10;
        string branch     = 11;

        // e.g. "success", "failure", "cancelled", "skipped".
        string conclusion = 12;

        string sender_login = 13;
    }

   message Volume {
        string tag = 1;
        string mount_point = 2;
        int64 size_mb = 3;
        int64 used_mb = 4;
        bool cache_hit = 5;
   }

    message BuildkiteJob {
        string job_id        = 1;
        string job_name      = 2;
        string pipeline_slug = 3;
        string pipeline_id   = 4;
        string build_id      = 5;
        int64  build_number  = 6;

        google.protobuf.Timestamp job_created_at  = 7;
        google.protobuf.Timestamp job_runnable_at = 8;
        google.protobuf.Timestamp job_started_at  = 9;
        google.protobuf.Timestamp job_finished_at = 10;

        string org_id     = 11;
        string repository = 12;
        string branch     = 13;

        // e.g. "passed", "failed", "canceled", "timed_out", "skipped", "broken"
        string job_state = 14;
    }
}
