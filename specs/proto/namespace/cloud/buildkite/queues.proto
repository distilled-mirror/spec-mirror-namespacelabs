syntax = "proto3";

package namespace.cloud.buildkite;

import "proto/namespace/cloud/iam/v1beta/authz.proto";
import "proto/namespace/stdlib/callback.proto";

// QueueService provides access to Buildkite queues registered with Namespace-managed
// agents.
//
// ## Access
//
// This service is available at the global endpoint:
// ```
// https://global.namespaceapis.com:443
// ```
//
// ## Authentication
//
// Calls require a *tenant token* passed as a Bearer token.
// See the [IAM API](https://buf.build/namespace/cloud/docs/main:namespace.cloud.iam.v1beta)
// for obtaining tokens.
service QueueService {
  // List queues registered for this tenant in Namespace.
  //
  // Authentication: tenant token.
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);

  // Get queue settings.
  //
  // Authentication: tenant token.
  rpc GetQueue(GetQueueRequest) returns (QueueResponse);

  // Update queue-wide settings.
  //
  // Authentication: tenant token.
  rpc UpdateQueue(UpdateQueueRequest) returns (QueueResponse);
}

message ListQueuesRequest {}

message ListQueuesResponse {
  repeated BuildkiteQueue queues = 1;
}

message GetQueueRequest {
  // Queue ID generated by Namespace.
  string queue_id = 1;
}

message QueueResponse {
  // Namespace-managed Buildkite queue.
  BuildkiteQueue queue = 1;
}

message UpdateQueueRequest {
  // Required field.
  string queue_id = 1;

  // Fully replaces the queue settings. Call GetQueue first and include any existing settings
  // that should be retained. If empty, this will reset the queue settings.
  QueueSettings settings = 2;
}

message QueueSettings {
  // Workload permissions for all instances running jobs for this queue.
  Permissions permissions = 1;

  // Tag of the workspace egress policy to apply to jobs running for this queue.
  // Jobs fail if they also set nsc-egress-policy in their agent tags.
  string egress_policy_tag = 2;

  OpenTelemetrySettings open_telemetry_settings = 3;

  CacheVolumeSettings cache_volume_settings = 4;
}

message OpenTelemetrySettings {
  string otlp_endpoint = 1;

  // Headers to be passed to the OTel collector.
  // Example: {name: "Authorization", value_from: {from_secret_id: "sec_abcdefg"}}
  // with sec_abcdefg containing the value "Bearer <token>".
  // Many providers also support additional or custom headers.
  repeated namespace.stdlib.HttpHeader headers = 2;

  // Defaults to GRPC unless HTTP_PROTOBUF is specified.
  OTLPProtocol otlp_protocol = 3;

  // Additional key-value pairs to be used as resource attributes.
  map<string, string> resource_attributes = 4;

  enum OTLPProtocol {
    OTLP_PROTOCOL_UNSPECIFIED = 0;
    OTLP_PROTOCOL_GRPC = 1;
    OTLP_PROTOCOL_HTTP_PROTOBUF = 2;
  }
}

message Permissions {
  PermissionsType permissions_type = 1;
  // Ignored unless permissions_type is CUSTOM.
  repeated namespace.cloud.iam.v1beta.Permission workload_permissions = 2;
}

enum PermissionsType {
  PERMISSIONS_TYPE_UNKNOWN = 0;
  DEFAULT = 1;
  CUSTOM = 2;
}

message CacheVolumeSettings {
  CacheVolumeCommit commit = 1;

  enum CacheVolumeCommit {
    CACHE_VOLUME_COMMIT_UNSPECIFIED = 0;
    CACHE_VOLUME_COMMIT_DEFAULT     = 1;
    CACHE_VOLUME_COMMIT_NEVER       = 2;
  }
}

message BuildkiteQueue {
  // The managed queue ID generated by Namespace.
  string id = 1;

  // The queue name in Buildkite.
  string queue_name = 2;

  // The Buildkite cluster to which this queue belongs.
  string cluster = 3;

  // The Buildkite organization.
  Organization organization = 4;

  // Additional queue settings.
  QueueSettings settings = 5;
}

message Organization {
  // The Buildkite organization slug.
  string org_slug = 1;

  // The Buildkite organization UUID.
  string org_uuid = 2;
}
