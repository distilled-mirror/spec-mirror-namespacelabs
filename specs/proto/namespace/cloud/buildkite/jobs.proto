syntax = "proto3";

package namespace.cloud.buildkite;

import "google/protobuf/timestamp.proto";

service JobsService {
    // Describes a Buildkite job by its job ID.
    rpc DescribeJob(DescribeJobRequest) returns (DescribeJobResponse);
}

message DescribeJobRequest {
    // The Buildkite job ID to describe
    string job_id = 1;
}

// DescribeJobResponse contains the described job.
message DescribeJobResponse {
    // The described Buildkite job.
    Job job = 1;
}

// Job represents a Buildkite command job and its associated build, pipeline, and runner.
message Job {
    // Unique Buildkite job ID.
    string                    job_id        =  1;
    // Repository associated with the job.
    string                    repository    =  2;
    // Unique Buildkite build ID.
    string                    build_id       =  3;
    // Build number within the pipeline.
    int64                     build_number   =  4;
    // Slug of the Buildkite pipeline.
    string                    pipeline_slug  =  5;
    // Label of the Buildkite job.
    string                    job_name       =  6;
    // e.g. "passed", "failed", "canceled", "timed_out", "skipped", "broken"
    string                    job_state      =  7;
    // URL to view the job in Buildkite.
    string                    job_url        =  8;
    // When the job was scheduled.
    google.protobuf.Timestamp scheduled_at  =  9;
    // When the job started running.
    google.protobuf.Timestamp started_at    = 10;
    // When the job completed.
    google.protobuf.Timestamp completed_at  = 11;
    // Runner information, if assigned.
    RunnerInfo                runner        = 12;
    // Branch associated with the build.
    string                    branch        = 13;
    // Commit SHA associated with the build.
    string                    commit_sha    = 14;
}

message RunnerInfo {
    // Instance ID of the underlying compute instance.
    string instance_id = 1;
}
